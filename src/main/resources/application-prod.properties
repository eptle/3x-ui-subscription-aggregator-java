# Профиль для Docker. Всё, что зависит от сервера, приходит из переменных окружения (.env рядом с docker-compose.yaml)

spring.datasource.url=jdbc:sqlite:/data/vpnservice.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite пишет в файл одним писателем, пул больше одного соединения даёт SQLITE_BUSY
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Только update: create в Hibernate 7.2 создаёт в SQLite колонку id без типа
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8080
# Приложение стоит за nginx: схему (https) и хост берём из X-Forwarded-*, иначе редиректы на /login уйдут на http
server.forward-headers-strategy=native

# Как часто опрашивать панели 3x-ui
aggregator.refresh-interval=${REFRESH_INTERVAL:5m}
# Без таймаутов один зависший сервер навсегда блокирует опрос
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=15s

# Подписка
aggregator.profile-title=${PROFILE_TITLE:VPN}
aggregator.update-interval-hours=12
aggregator.default-fingerprint=firefox
# Внешний адрес для ссылок на подписку в админке, например https://chad.whiteman.pics
aggregator.public-url=${PUBLIC_URL:}

# Вход в админку и /api/admin/**. Без ADMIN_PASSWORD приложение не стартует
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD}
