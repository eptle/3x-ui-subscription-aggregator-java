spring.datasource.url=jdbc:sqlite:vpnservice.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite пишет в файл одним писателем, пул больше одного соединения даёт SQLITE_BUSY
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Как часто опрашивать панели 3x-ui
aggregator.refresh-interval=5m
# Без таймаутов один зависший сервер навсегда блокирует опрос
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=15s

# Подписка
aggregator.profile-title=VPN
aggregator.update-interval-hours=12
aggregator.default-fingerprint=firefox

# Секреты из .env (формат KEY=value) в рабочей директории. optional: без файла приложение тоже стартует
spring.config.import=optional:file:.env[.properties]

# Логин для /api/admin/**. Пароль берётся из .env: ADMIN_PASSWORD=...
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD}

# Внешний адрес агрегатора для ссылок на подписку в админке. Не задан: берётся адрес, по которому открыта админка
#aggregator.public-url=https://chad.whiteman.pics

# Клиенты (подстрока User-Agent), которым вместо JSON-конфигов отдаётся base64-список vless:// (только reality)
#aggregator.link-clients=v2rayng,throne
